schema_version: 1
kind: sdkwork.database.schema
database_role: authoritative-server
module_id: web
contract_version: 1.4.0
owner_team: web-platform
compliance_level: L2
engines:
  - postgres
table_prefix: web_
serialization:
  int64: string
  decimal: string
  time: iso8601_utc
tables:
  - name: web_site
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      data_scope: { type: enum_int32, required: true }
      user_id: { type: int64, required: false }
      name: { type: string, required: true }
      slug: { type: string, required: true }
      description: { type: string, required: false }
      application_type: { type: string, required: true }
      site_type: { type: enum_int32, required: true }
      status: { type: enum_int32, required: true }
      runtime_config: { type: json, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
      deleted_by: { type: int64, required: false }
    constraints:
      - { name: web_site_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_site_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_site_slug, type: unique, columns: [tenant_id, slug] }
      - { name: chk_web_site_application_type, type: check }
      - { name: chk_web_site_type, type: check }
      - { name: chk_web_site_status, type: check }
    indexes:
      - { name: uk_web_site_uuid, columns: [uuid], unique: true }
      - { name: uk_web_site_slug, columns: [tenant_id, slug], unique: true }
      - { name: idx_web_site_tenant_status_updated, columns: [tenant_id, organization_id, status, updated_at] }
      - { name: idx_web_site_tenant_application_type_updated, columns: [tenant_id, application_type, updated_at] }
      - { name: idx_web_site_user_updated, columns: [tenant_id, user_id, updated_at] }
      - { name: idx_web_site_slug, columns: [tenant_id, slug] }

  - name: web_root_domain
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      hostname: { type: string, required: true }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: web_root_domain_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_root_domain_uuid, type: unique, columns: [uuid] }
      - { name: chk_web_root_domain_status, type: check }
    indexes:
      - { name: uk_web_root_domain_uuid, columns: [uuid], unique: true }
      - { name: uk_web_root_domain_tenant_hostname, columns: [tenant_id, hostname], unique: true, predicate: "deleted_at IS NULL" }
      - { name: idx_web_root_domain_tenant_updated, columns: [tenant_id, updated_at, id] }

  - name: web_domain
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      root_domain_id: { type: int64, required: false }
      site_id: { type: int64, required: false }
      hostname: { type: string, required: true }
      is_primary: { type: bool, required: true }
      is_verified: { type: bool, required: true }
      verify_token: { type: string, required: false }
      ssl_enabled: { type: bool, required: true }
      ssl_provider: { type: string, required: false }
      redirect_target: { type: string, required: false }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: web_domain_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_domain_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_domain_hostname, type: unique, columns: [hostname] }
      - name: chk_web_domain_primary_binding
        type: check
        expression: site_id IS NOT NULL OR is_primary = false
      - name: fk_web_domain_site
        type: foreign_key
        columns: [site_id]
        references_table: web_site
        references_columns: [id]
      - name: fk_web_domain_root_domain
        type: foreign_key
        columns: [root_domain_id]
        references_table: web_root_domain
        references_columns: [id]
    indexes:
      - { name: uk_web_domain_uuid, columns: [uuid], unique: true }
      - { name: uk_web_domain_hostname, columns: [hostname], unique: true }
      - { name: idx_web_domain_site, columns: [site_id] }
      - { name: idx_web_domain_tenant_status, columns: [tenant_id, status] }
      - { name: idx_web_domain_root_updated, columns: [tenant_id, root_domain_id, updated_at, id] }

  - name: web_nginx_config
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      domain_id: { type: int64, required: false }
      config_type: { type: enum_int32, required: true }
      config_name: { type: string, required: true }
      config_content: { type: text, required: true }
      config_hash: { type: string, required: true }
      is_active: { type: bool, required: true }
      version_no: { type: int32, required: true }
      deployed_at: { type: instant, required: false }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_nginx_config_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_nginx_config_uuid, type: unique, columns: [uuid] }
      - name: fk_web_nginx_config_site
        type: foreign_key
        columns: [site_id]
        references_table: web_site
        references_columns: [id]
    indexes:
      - { name: uk_web_nginx_config_uuid, columns: [uuid], unique: true }
      - { name: idx_web_nginx_config_site_active, columns: [site_id, is_active] }
      - { name: idx_web_nginx_config_type_status, columns: [config_type, status] }

  - name: web_certificate
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      domain_id: { type: int64, required: false }
      site_id: { type: int64, required: false }
      cert_name: { type: string, required: true }
      cert_type: { type: enum_int32, required: true }
      issuer: { type: string, required: false }
      subject: { type: string, required: false }
      san_list: { type: text, required: false }
      fingerprint: { type: string, required: false }
      cert_path: { type: string, required: false }
      key_path: { type: string, required: false }
      chain_path: { type: string, required: false }
      not_before: { type: instant, required: false }
      not_after: { type: instant, required: false }
      auto_renew: { type: bool, required: true }
      renewal_status: { type: enum_int32, required: true }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_certificate_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_certificate_uuid, type: unique, columns: [uuid] }
    indexes:
      - { name: uk_web_certificate_uuid, columns: [uuid], unique: true }
      - { name: idx_web_certificate_domain, columns: [domain_id] }
      - { name: idx_web_certificate_expiry, columns: [not_after], predicate: status = 1 }
      - { name: idx_web_certificate_renewal, columns: [renewal_status, not_after], predicate: auto_renew = true AND status = 1 }

  - name: web_source_version
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      user_id: { type: int64, required: false }
      site_id: { type: int64, required: true }
      version_tag: { type: string, required: true }
      source_type: { type: string, required: true }
      source_ref: { type: string, required: false }
      commit_hash: { type: string, required: false }
      artifact_path: { type: string, required: true }
      artifact_size: { type: int64, required: true }
      artifact_hash: { type: string, required: true }
      config_snapshot: { type: json, required: true }
      status: { type: enum_int32, required: true }
      pruned_at: { type: instant, required: false }
      pruned_by: { type: int64, required: false }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_source_version_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_source_version_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_source_version_site_tag, type: unique, columns: [tenant_id, site_id, version_tag] }
      - { name: chk_web_source_version_type, type: check }
      - { name: chk_web_source_version_status, type: check }
      - name: fk_web_source_version_site
        type: foreign_key
        columns: [site_id]
        references_table: web_site
        references_columns: [id]
    indexes:
      - { name: uk_web_source_version_uuid, columns: [uuid], unique: true }
      - { name: uk_web_source_version_site_tag, columns: [tenant_id, site_id, version_tag], unique: true }
      - { name: idx_web_source_version_site_created, columns: [site_id, created_at] }
      - { name: idx_web_source_version_retention, columns: [tenant_id, site_id, status, created_at] }

  - name: web_deployment
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      user_id: { type: int64, required: false }
      site_id: { type: int64, required: true }
      source_version_id: { type: int64, required: false }
      deploy_type: { type: enum_int32, required: true }
      version_tag: { type: string, required: false }
      commit_hash: { type: string, required: false }
      source_ref: { type: string, required: false }
      build_log: { type: text, required: false }
      deploy_log: { type: text, required: false }
      artifact_path: { type: string, required: false }
      artifact_size: { type: int64, required: false }
      artifact_hash: { type: string, required: false }
      environment: { type: string, required: true }
      status: { type: enum_int32, required: true }
      started_at: { type: instant, required: false }
      completed_at: { type: instant, required: false }
      duration_ms: { type: int64, required: false }
      rollback_from: { type: int64, required: false }
      idempotency_key: { type: string, required: false }
      request_id: { type: string, required: false }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_deployment_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_deployment_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_deployment_idempotency, type: unique, columns: [tenant_id, idempotency_key] }
      - name: fk_web_deployment_site
        type: foreign_key
        columns: [site_id]
        references_table: web_site
        references_columns: [id]
      - name: fk_web_deployment_source_version
        type: foreign_key
        columns: [source_version_id]
        references_table: web_source_version
        references_columns: [id]
    indexes:
      - { name: uk_web_deployment_uuid, columns: [uuid], unique: true }
      - { name: uk_web_deployment_idempotency, columns: [tenant_id, idempotency_key], unique: true }
      - { name: idx_web_deployment_site_created, columns: [site_id, created_at] }
      - { name: idx_web_deployment_source_version, columns: [source_version_id] }
      - { name: idx_web_deployment_tenant_status, columns: [tenant_id, status, created_at] }
      - { name: idx_web_deployment_status, columns: [status], predicate: "(status = ANY (ARRAY[0, 1, 2]))" }

  - name: web_env_variable
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      environment: { type: string, required: true }
      key: { type: string, required: true }
      value_encrypted: { type: text, required: true }
      is_secret: { type: bool, required: true }
      status: { type: enum_int32, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_env_variable_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_env_variable_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_env_variable_key, type: unique, columns: [site_id, environment, key] }
    indexes:
      - { name: uk_web_env_variable_uuid, columns: [uuid], unique: true }
      - { name: uk_web_env_variable_key, columns: [site_id, environment, key], unique: true }
      - { name: idx_web_env_variable_site_env, columns: [site_id, environment] }

  - name: web_health_check
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      domain_id: { type: int64, required: false }
      check_type: { type: enum_int32, required: true }
      check_url: { type: string, required: false }
      check_interval: { type: int32, required: true }
      timeout_ms: { type: int32, required: true }
      retry_count: { type: int32, required: true }
      expected_status: { type: int32, required: false }
      expected_body: { type: string, required: false }
      status: { type: enum_int32, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_health_check_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_health_check_uuid, type: unique, columns: [uuid] }
      - name: fk_web_health_check_site
        type: foreign_key
        columns: [site_id]
        references_table: web_site
        references_columns: [id]
    indexes:
      - { name: uk_web_health_check_uuid, columns: [uuid], unique: true }
      - { name: idx_web_health_check_site, columns: [site_id] }

  - name: web_health_result
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      health_check_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      is_healthy: { type: bool, required: true }
      response_ms: { type: int32, required: false }
      status_code: { type: int32, required: false }
      error_message: { type: string, required: false }
      checked_at: { type: instant, required: true }
      created_at: { type: instant, required: true }
    constraints:
      - { name: web_health_result_pkey, type: primary_key, columns: [id] }
    indexes:
      - { name: idx_web_health_result_check_time, columns: [health_check_id, checked_at] }
      - { name: idx_web_health_result_site_time, columns: [site_id, checked_at] }

  - name: web_audit_log
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      operator_id: { type: int64, required: true }
      operator_type: { type: string, required: true }
      action: { type: string, required: true }
      target_type: { type: string, required: true }
      target_id: { type: int64, required: false }
      target_uuid: { type: string, required: false }
      request_id: { type: string, required: false }
      ip_address: { type: string, required: false }
      user_agent: { type: string, required: false }
      changes: { type: json, required: false }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
    constraints:
      - { name: web_audit_log_pkey, type: primary_key, columns: [id] }
    indexes:
      - { name: idx_web_audit_log_target, columns: [target_type, target_id, created_at] }
      - { name: idx_web_audit_log_operator, columns: [operator_id, created_at] }
      - { name: idx_web_audit_log_tenant_action, columns: [tenant_id, action, created_at] }

  - name: web_server
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      name: { type: string, required: true }
      host: { type: string, required: true }
      tenant_scope_hash: { type: string, required: true }
      ssh_port: { type: int32, required: true }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_server_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_server_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_server_host, type: unique, columns: [tenant_id, host] }
      - { name: uk_web_server_tenant_id, type: unique, columns: [tenant_id, id] }
      - { name: chk_web_server_tenant_scope_hash, type: check }
    indexes:
      - { name: uk_web_server_uuid, columns: [uuid], unique: true }
      - { name: uk_web_server_host, columns: [tenant_id, host], unique: true }
      - { name: uk_web_server_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: idx_web_server_tenant_status, columns: [tenant_id, status, updated_at] }

  - name: web_runtime_assignment
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      server_id: { type: int64, required: true }
      environment: { type: string, required: true }
      generation: { type: int64, required: true }
      snapshot_uuid: { type: string, required: true }
      snapshot_sha256: { type: string, required: true }
      runtime_set: { type: json, required: true }
      runtime_set_bytes: { type: int64, required: true }
      assigned_by_subject: { type: string, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_runtime_assignment_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_runtime_assignment_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_runtime_assignment_tenant_id, type: unique, columns: [tenant_id, id, server_id] }
      - { name: uk_web_runtime_assignment_generation, type: unique, columns: [tenant_id, server_id, environment, generation] }
      - { name: uk_web_runtime_assignment_snapshot, type: unique, columns: [snapshot_uuid] }
      - name: fk_web_runtime_assignment_server
        type: foreign_key
        columns: [tenant_id, server_id]
        references_table: web_server
        references_columns: [tenant_id, id]
      - { name: chk_web_runtime_assignment_environment, type: check }
      - { name: chk_web_runtime_assignment_generation, type: check }
      - { name: chk_web_runtime_assignment_snapshot_sha256, type: check }
      - { name: chk_web_runtime_assignment_runtime_set, type: check }
      - { name: chk_web_runtime_assignment_runtime_set_bytes, type: check }
    indexes:
      - { name: uk_web_runtime_assignment_uuid, columns: [uuid], unique: true }
      - { name: uk_web_runtime_assignment_tenant_id, columns: [tenant_id, id, server_id], unique: true }
      - { name: uk_web_runtime_assignment_generation, columns: [tenant_id, server_id, environment, generation], unique: true }
      - { name: uk_web_runtime_assignment_snapshot, columns: [snapshot_uuid], unique: true }
      - { name: idx_web_runtime_assignment_current, columns: [tenant_id, server_id, environment, generation] }

  - name: web_runtime_observation
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      assignment_id: { type: int64, required: true }
      server_id: { type: int64, required: true }
      state: { type: string, required: true }
      node_version: { type: string, required: false }
      reason_code: { type: string, required: false }
      detail: { type: string, required: false }
      observed_at: { type: instant, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: web_runtime_observation_pkey, type: primary_key, columns: [id] }
      - { name: uk_web_runtime_observation_uuid, type: unique, columns: [uuid] }
      - { name: uk_web_runtime_observation_state, type: unique, columns: [tenant_id, assignment_id, state] }
      - name: fk_web_runtime_observation_assignment
        type: foreign_key
        columns: [tenant_id, assignment_id, server_id]
        references_table: web_runtime_assignment
        references_columns: [tenant_id, id, server_id]
      - { name: chk_web_runtime_observation_state, type: check }
      - { name: chk_web_runtime_observation_reason, type: check }
    indexes:
      - { name: uk_web_runtime_observation_uuid, columns: [uuid], unique: true }
      - { name: uk_web_runtime_observation_state, columns: [tenant_id, assignment_id, state], unique: true }
      - { name: idx_web_runtime_observation_assignment, columns: [tenant_id, assignment_id, id] }
      - { name: idx_web_runtime_observation_node_time, columns: [tenant_id, server_id, observed_at] }
