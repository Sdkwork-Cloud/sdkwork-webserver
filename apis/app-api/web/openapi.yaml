components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SiteIdParam:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainIdParam:
      name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/SdkWorkPlatformErrorCode"
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    CreateSiteRequest:
      type: object
      required:
        - name
        - siteType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9][a-z0-9\-]*[a-z0-9]$
        description:
          type: string
          maxLength: 500
        applicationType:
          type: string
          enum:
            - WEB
            - API
          default: WEB
        siteType:
          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
        runtimeConfig:
          type: object
          properties:
            buildCommand:
              type: string
            outputDirectory:
              type: string
            nodeVersion:
              type: string
            installCommand:
              type: string
            startCommand:
              type: string
    UpdateSiteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        runtimeConfig:
          type: object
    SiteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        applicationType:
          type: string
          enum:
            - WEB
            - API
        siteType:
          type: integer
        status:
          type: integer
        runtimeConfig:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SitePage:
      type: object
      properties:
        items: *a1
        total:
          type: string
          format: int64
          pattern: ^[0-9]+$
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: i64
          description: Total item count as a string to avoid JavaScript precision loss.
        page:
          type: integer
        pageSize:
          type: integer
    CreateDomainRequest:
      type: object
      additionalProperties: false
      required:
        - hostname
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        isPrimary:
          type: boolean
          default: false
        sslEnabled:
          type: boolean
          default: true
        sslProvider:
          type: string
          enum:
            - letsencrypt
            - custom
            - none
