        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-owner: sdkwork-web-server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SdkWorkApiResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: "#/components/schemas/SiteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: sites.delete
      summary: 删除站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-owner: sdkwork-web-server
      responses:
        "204":
          description: 删除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /app/v3/api/sites/{siteId}/activate:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
