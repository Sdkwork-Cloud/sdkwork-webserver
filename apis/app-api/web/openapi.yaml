        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        value:
          type: string
          maxLength: 65536
        environment:
          type: string
          enum:
            - development
            - test
            - staging
            - production
