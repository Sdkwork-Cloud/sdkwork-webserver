openapi: 3.1.2
info:
  title: SDKWork Web App API
  description: SDKWork Web Server 应用端 API，供前端应用客户端调用
  version: 1.0.0
  contact:
    name: SDKWork Team
servers:
  - url: https://api.web.sdkwork.com
    description: Production
  - url: http://localhost:3800
    description: Local Development
security:
  - AuthToken: []
    AccessToken: []
paths:
  /app/v3/api/sites:
    get:
      operationId: sites.list
      summary: 获取站点列表
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.read
      x-sdkwork-owner: sdkwork-web-server
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
              - 3
        - name: applicationType
          in: query
          schema:
            type: string
            enum:
              - WEB
              - API
        - name: siteType
          in: query
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
              - 6
              - 6
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SdkWorkApiResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required:
                          - items
                          - pageInfo
                        properties:
                          items: &a1
                            type: array
                            items:
                              $ref: "#/components/schemas/SiteResponse"
                          pageInfo:
                            $ref: "#/components/schemas/PageInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: sites.create
      summary: 创建站点
      tags:
        - site
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-sdkwork-owner: sdkwork-web-server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SdkWorkApiResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - item
                        properties:
                          item:
                            $ref: "#/components/schemas/SiteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /app/v3/api/sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    get:
      operationId: sites.retrieve
