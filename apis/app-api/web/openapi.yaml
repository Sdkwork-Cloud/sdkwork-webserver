          format: uuid
        hostname:
          type: string
        isPrimary:
          type: boolean
        isVerified:
          type: boolean
        sslEnabled:
          type: boolean
        sslProvider:
          type: string
        status:
          type: integer
        createdAt:
          type: string
          format: date-time
    DomainPage:
      type: object
      properties:
        items: *a2
        total:
          type: string
          format: int64
          pattern: ^[0-9]+$
