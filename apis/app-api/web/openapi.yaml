        artifactDriveUri:
          type: string
          pattern: '^drive://spaces/[^/?#]+/nodes/[^/?#]+$'
        artifactSize:
          type: string
          format: int64
          pattern: '^[1-9][0-9]*$'
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: i64
        artifactHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
