          type: integer
          enum:
            - 1
            - 2
            - 3
            - 4
        versionTag:
          type: string
          minLength: 1
          maxLength: 100
        commitHash:
          type: string
          minLength: 7
          maxLength: 64
          pattern: '^[a-f0-9]{7,64}$'
        sourceRef:
          type: string
          minLength: 1
          maxLength: 500
        artifactDriveUri:
          type: string
          maxLength: 500
          pattern: '^drive://spaces/[^/?#]+/nodes/[^/?#]+$'
